<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LoveLace</title>
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Embedded styling needed to control position without modifying your external style.css structure */
        .input-relative-group {
            position: relative;
            margin-bottom: 25px; /* Adds space for the bubble to sit comfortably between fields */
        }
        
        .error-bubble {
            position: absolute;
            left: 0;
            top: 100%;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #f97316;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 4px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #1e293b;
            width: max-content;
            max-width: 100%;
            box-sizing: border-box;
        }

        .error-icon {
            background-color: #f97316;
            color: #ffffff;
            font-weight: 800;
            border-radius: 4px;
            padding: 1px 6px;
            display: inline-block;
            font-family: sans-serif;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Create an account</h2>
        <h4>Enter your information below to create your account</h4>

        <!-- Signup Form -->
        <form id="signupForm">
            <div class="name-row">
                <div class="input-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                </div>
                <div class="input-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john.doe@example.com" required>
            </div>

            <!-- Changed class to input-relative-group to anchor error bubble right below password input wrapper -->
            <div class="input-group input-relative-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" minlength="8" required>
                    <button type="button" class="password-toggle" data-target="password">View</button>
                </div>
                <!-- Inline Error Bubble placed directly before Confirm Password block -->
                <div id="passwordErrorBubble" class="error-bubble hidden">
                    <span class="error-icon">!</span>
                    <span id="passwordErrorText"></span>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="••••••••" minlength="8" required>
                    <button type="button" class="password-toggle" data-target="confirmPassword">View</button>
                </div>
            </div>

            <div class="terms-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="terms" required>
                    I agree to the <a href="/terms.html" target="_blank">terms and conditions</a>
                </label>
            </div>

            <button type="submit">Create account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login.html">Sign in</a>
        </div>
    </div>

    <script>
        // --- 1. Text-Based Password Visibility Toggle Logic ---
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    button.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    button.textContent = 'View';
                }
            });
        });

        // --- UI Error Element DOM Bindings ---
        const pwdBubble = document.getElementById('passwordErrorBubble');
        const pwdText = document.getElementById('passwordErrorText');

        // Typing inputs clear errors instantly
        document.getElementById('password').addEventListener('input', () => pwdBubble.classList.add('hidden'));
        document.getElementById('confirmPassword').addEventListener('input', () => pwdBubble.classList.add('hidden'));

        // --- 2. Signup Form Submission Flow ---
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            pwdBubble.classList.add('hidden'); // Clear prior bubbles on re-submit

            const first_name = document.getElementById('firstName').value.trim();
            const last_name = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Password matching validation
            if (password !== confirmPassword) {
                pwdText.textContent = "Passwords do not match. Please try again.";
                pwdBubble.classList.remove('hidden');
                return;
            }

            try {
    const response = await fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ first_name, last_name, email, password })
    });

    // 1. If the server returns a bad status code (400, 409, 500, etc.)
    if (!response.ok) {
        let errorMessage = 'Registration failed.';
        
        try {
            // Attempt to read the JSON error message sent by the backend
            const errorData = await response.json();
            errorMessage = errorData.error || errorData.message || errorMessage;
        } catch (jsonParseError) {
            // Fallback if backend returned text or HTML instead of JSON
            errorMessage = `Server Error (${response.status}): ${response.statusText}`;
        }

        throw new Error(errorMessage);
    }

    // 2. Only parse successful data if response.ok is true
    const data = await response.json();
    alert(data.message);
    window.location.href = '/login.html';

} catch (err) {
    // 3. Your bubble logic now safely receives the correct server message
    if (err.message.toLowerCase().includes('password')) {
        pwdText.textContent = err.message;
        pwdBubble.classList.remove('hidden');
    } else {
        alert(err.message);
    }
}

        });
    </script>
</body>
</html>
