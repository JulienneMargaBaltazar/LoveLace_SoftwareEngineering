<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - LoveLace</title>
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Create an account</h2>
        <h4>Enter your information below to create your account</h4>

        <!-- Signup Form -->
        <form id="signupForm">
            <div class="name-row">
                <div class="input-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" placeholder="John" required>
                </div>
                <div class="input-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" placeholder="Doe" required>
                </div>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john.doe@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper" style="position: relative; width: 100%;">
                    <input type="password" id="password" placeholder="••••••••" minlength="8" required style="width: 100%; padding-right: 60px; box-sizing: border-box;">
                    <button type="button" class="password-toggle" data-target="password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px;">View</button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm password</label>
                <div class="password-wrapper" style="position: relative; width: 100%;">
                    <input type="password" id="confirmPassword" placeholder="••••••••" minlength="8" required style="width: 100%; padding-right: 60px; box-sizing: border-box;">
                    <button type="button" class="password-toggle" data-target="confirmPassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0; font-size: 12px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.5px;">View</button>
                </div>
            </div>

            <div class="terms-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="terms" required>
                    I agree to the <a href="/terms.html" target="_blank">terms and conditions</a>
                </label>
            </div>

            <button type="submit">Create account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login.html">Sign in</a>
        </div>
    </div>

    <script>
        // --- 1. Text-Based Password Visibility Toggle Logic ---
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    button.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    button.textContent = 'View';
                }
            });
        });

        // --- 2. Signup Form Submission Flow ---
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const first_name = document.getElementById('firstName').value.trim();
            const last_name = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Password matching validation
            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return;
            }

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ first_name, last_name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed.');
                }

                alert(data.message);
                window.location.href = '/login.html';

            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
