<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Include the Supabase Client Library via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="card">
        <h2>Forgot your password?</h2>
        <h4>No worries. Enter your email and we will send you a reset link.</h4>

        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@company.com">
            </div>
            <button type="submit">Send Reset Link</button>
        </form>

        <div id="message"></div>

        <div class="auth-footer">
            <a href="/login.html">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        // Initialize your live Supabase connection using your project keys
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdnlleW9mdGNvZGtranNzeHJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTQ2MTYsImV4cCI6MjEwODE3MDYxNn0.0JqB0g4APzDQQMedkUr7qIlbjGE5Y1BQo1qAbfVu8ZI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            
            msgDiv.className = 'msg-success';
            msgDiv.innerText = 'Sending request...';

            try {
                // Route the real password reset request to your Supabase engine
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    // Redirects the user directly to your password updates page upon confirmation link execution
                    redirectTo: window.location.origin + '/update-password.html',
                });

                if (error) {
                    msgDiv.className = 'msg-error';
                    msgDiv.innerText = error.message || 'An error occurred. Please try again.';
                    return;
                }

                // Success
                msgDiv.className = 'msg-success';
                msgDiv.innerText = 'Password reset link has been sent to your email inbox via Resend!';
            } catch (err) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = 'Network error or server unavailable.';
            }
        });
    </script>
</body>
</html>
