<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Forgot your password?</h2>
        <h4>No worries. Enter your email and we will send you a reset link.</h4>

        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@company.com">
            </div>
            <button type="submit">Send Reset Link</button>
        </form>

        <div id="message"></div>

        <div class="auth-footer">
            <a href="/login.html">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const msgDiv = document.getElementById('message');
            
            msgDiv.className = 'msg-success';
            msgDiv.innerText = 'Sending request...';

            try {
                const response = await fetch('/api/auth/forgotpassword', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                msgDiv.className = 'msg-success';
                msgDiv.innerText = data.message || 'Check your terminal for the simulated reset link!';
            } catch (err) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
