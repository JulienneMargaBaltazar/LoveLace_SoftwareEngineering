<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Create New Password</h2>
        <p class="card-subtitle">Please enter your new secure password below.</p>
        
        <form id="resetForm">
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="8" placeholder="••••••••">
            </div>
            <div class="input-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" required minlength="8" placeholder="••••••••">
            </div>
            <button type="submit">Update Password</button>
        </form>

        <div id="message"></div>

        <div class="auth-footer">
            <a href="/login.html">&larr; Back to Login</a>
        </div>
    </div>

    <script>
        // Extract the token query parameter from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const msgDiv = document.getElementById('message');

        if (!token) {
            msgDiv.className = 'msg-error';
            msgDiv.innerText = 'Missing or invalid reset token. Please request a new link.';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            msgDiv.innerText = '';

            // Check if passwords match
            if (newPassword !== confirmPassword) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = 'Passwords do not match. Please try again.';
                return;
            }

            try {
                const response = await fetch('/api/auth/passwordreset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to reset password.');
                }

                alert(data.message);
                window.location.href = '/login.html';

            } catch (err) {
                msgDiv.className = 'msg-error';
                msgDiv.innerText = err.message;
            }
        });
    </script>
</body>
</html>
