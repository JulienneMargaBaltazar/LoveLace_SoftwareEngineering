<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - LoveLace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        h2 { margin-top: 0; color: #1e293b; }
        p { color: #64748b; font-size: 14px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; font-size: 14px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #059669; }
        .error-msg { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Create New Password</h2>
        <p>Please enter your new secure password below.</p>
        
        <form id="resetForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
            </div>
            <button type="submit">Update Password</button>
        </form>

        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script>
        // Extract the token query parameter from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const errorDiv = document.getElementById('errorMsg');

        if (!token) {
            errorDiv.innerText = 'Missing or invalid reset token. Please request a new link.';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            errorDiv.innerText = '';

            try {
                const response = await fetch('/api/auth/passwordreset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to reset password.');
                }

                alert(data.message);
                window.location.href = '/login.html';

            } catch (err) {
                errorDiv.innerText = err.message;
            }
        });
    </script>
</body>
</html>
