<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LoveLace - Set New Password</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="card">
        <h2>Update Your Password</h2>
        <p>First-time login detected. Please choose a new password.</p>
        <form id="setPasswordForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="6" placeholder="At least 6 characters">
            </div>
            <button type="submit">Update Password & Continue</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;
            const msgEl = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to update password.');

                alert('Password updated successfully! Please log in with your new credentials.');
                window.location.href = '/login.html';
            } catch (err) {
                msgEl.style.color = '#d32f2f';
                msgEl.textContent = err.message;
            }
        });
    </script>
</body>
</html>
