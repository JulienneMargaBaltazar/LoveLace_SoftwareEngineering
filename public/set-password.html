<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveLace - Set New Password</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Update Your Password</h2>
        <p class="card-subtitle">First-time login detected. Please choose a new password.</p>
        
        <form id="setPasswordForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="8" placeholder="Enter new password">
                <div style="color: #6b7280; font-size: 0.75rem; margin-top: 0.35rem;">
                    <ul style="margin: 0.2rem 0 0 1rem; padding: 0; list-style-type: disc;">
                        <li>At least 8 characters long</li>
                        <li>At least one number</li>
                        <li>At least one special character</li>
                    </ul>
                </div>
            </div>
            <button type="submit">Update Password & Continue</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const newPassword = document.getElementById('newPassword').value;
            const msgEl = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Failed to update password.');

                alert('Password updated successfully! Please log in with your new credentials.');
                window.location.href = '/login.html';
            } catch (err) {
                msgEl.className = 'msg-error';
                msgEl.textContent = err.message;
            }
        });
    </script>
</body>
</html>
