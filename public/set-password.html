<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveLace - Set New Password</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Include the Supabase Client Library via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div class="card">
        <h2>Update Your Password</h2>
        <p class="card-subtijutle" id="subtitle">Please choose your new secure account password below.</p>
        
        <form id="setPasswordForm">
            <!-- Email input removed as Supabase tracks the user session via the link token -->
            <div class="input-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required minlength="8" placeholder="Enter new password">
                <div style="color: #6b7280; font-size: 0.75rem; margin-top: 0.35rem;">
                    <ul style="margin: 0.2rem 0 0 1rem; padding: 0; list-style-type: disc;">
                        <li>At least 8 characters long</li>
                        <li>At least one number</li>
                        <li>At least one special character</li>
                    </ul>
                </div>
            </div>
            <button type="submit" id="submitBtn">Update Password & Continue</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        // Initialize your live Supabase connection
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdnlleW9mdGNvZGtranNzeHJpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1OTQ2MTYsImV4cCI6MjEwODE3MDYxNn0.0JqB0g4APzDQQMedkUr7qIlbjGE5Y1BQo1qAbfVu8ZI";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const msgEl = document.getElementById('message');

        // STEP 1: Intercept Token Lifecycle Edge Cases (TC-06 & TC-07) on page initial load
        window.addEventListener('load', () => {
            const hashParams = new URLSearchParams(window.location.hash.replace('#', '?'));
            const errorType = hashParams.get('error');
            const errorDescription = hashParams.get('error_description');

            // Catching age threshold violation (TC-06) or token signature reuse guardrails (TC-07)
            if (errorType || (errorDescription && errorDescription.includes('expired')) || (errorDescription && errorDescription.includes('invalid_grant'))) {
                // Drop execution and output the exact error string from your documentation
                alert("Token expired. Please request a new verification path.");
                
                // Lockdown the interactive elements on the page
                document.getElementById('setPasswordForm').style.display = 'none';
                document.getElementById('subtitle').innerText = "Security check failed.";
                
                msgEl.className = 'msg-error';
                msgEl.textContent = 'Token expired. Please request a new verification path.';
            }
        });

        // STEP 2: Handle saving the validated input string to the Supabase database
        document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            
            msgEl.className = 'msg-success';
            msgEl.textContent = 'Updating your security credentials...';

            try {
                // Overwrite the password field directly inside the auth.users system table
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                alert('Password updated successfully! Please log in with your new credentials.');
                window.location.href = '/login.html';
            } catch (err) {
                msgEl.className = 'msg-error';
                msgEl.textContent = err.message || 'Failed to update password.';
            }
        });
    </script>
</body>
</html>
