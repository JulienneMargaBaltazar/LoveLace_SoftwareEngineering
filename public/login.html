<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional helper for login-specific alignment */
        .forgot-container {
            text-align: right;
            margin-bottom: 1.25rem;
        }
        .forgot-container a {
            font-size: 0.875rem;
            color: #5C5C99;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome back</h2>
        <h4>Log in to continue to your workspace.</h4>

        <!-- Login Form -->
        <form id="loginForm" action="/login" method="POST">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" data-target="password">View</button>
                </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-container">
                <a href="/forgotpassword.html">Forgot password?</a>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/signup.html">Sign up</a>
        </div>
    </div>

    <script>
        // --- 1. Text-Based Password Visibility Toggle Logic ---
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    button.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    button.textContent = 'View';
                }
            });
        });

        // --- 2. Cleaned & Consolidated Login Form Submission Flow ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop default browser page reload loop
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Sends structured payload directly to router.post('/login') inside authRoutes.js
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success! Redirect straight to your updated superadmin dashboard view layout
                    window.location.href = '/superadmin-dashboard.html';
                } else {
                    // Triggers alert with the backend error message from your router checks
                    alert(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (error) {
                console.error('Frontend Login Fetch Error:', error);
                alert('Could not establish contact with the backend server. Please try again.');
            }
        });
    </script>
</body>
</html>
