<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional helper for login-specific alignment */
        .forgot-container {
            text-align: right;
            margin-bottom: 1.25rem;
        }
        .forgot-container a {
            font-size: 0.875rem;
            color: #5C5C99;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome back</h2>
        <h4>Log in to continue to your workspace.</h4>

        <!-- Login Form -->
        <form id="loginForm" action="/login" method="POST">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@company.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" data-target="password">View</button>
                </div>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-container">
                <a href="/forgotpassword.html">Forgot password?</a>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/signup.html">Sign up</a>
        </div>
    </div>

    <script>
        // --- 1. Text-Based Password Visibility Toggle Logic ---
        document.querySelectorAll('.password-toggle').forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    button.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    button.textContent = 'View';
                }
            });
        });

        // --- 2. Login Form Submission Flow ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Stop default form reload

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Crucial for cookies/sessions
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Check if backend provided a redirect URL, or fallback based on role
                    if (data.redirectUrl) {
                        window.location.href = data.redirectUrl;
                    } else if (data.roleId === 1) {
                        window.location.href = '/superadmin-dashboard.html';
                    } else if (data.roleId === 2) {
                        window.location.href = '/dashboard.html';
                    } else {
                        window.location.href = '/user-dashboard.html';
                    }
                } else {
                    alert(data.error || 'Login failed. Please check your credentials.');
                }
            } catch (err) {
                console.error('Login network error:', err);
                alert('An unexpected error occurred. Please try again.');
            }
        });

       document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });
    
    const data = await response.json();
    if (response.ok) {
        window.location.href = '/superadmin-dashboard.html';
    } else {
        alert(data.error);
    }
});
 
    </script>
</body>
</html>
