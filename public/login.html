<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional helper for login-specific alignment */
        .forgot-container {
            text-align: right;
            margin-bottom: 1.25rem;
        }
        .forgot-container a {
            font-size: 0.875rem;
            color: #5C5C99;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome back</h2>
        <h4>Log in to continue to your workspace.</h4>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@company.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-container">
                <a href="/forgotpassword.html">Forgot password?</a>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/signup.html">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); // Stop default form reload

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // Crucial for cookies/sessions
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
            // Check if backend provided a redirect URL, or fallback based on role
            if (data.redirectUrl) {
                window.location.href = data.redirectUrl;
            } else if (data.roleId === 1) {
                window.location.href = '/superadmin-dashboard.html';
            } else if (data.roleId === 2) {
                window.location.href = '/dashboard.html';
            } else {
                window.location.href = '/user-dashboard.html';
            }
        } else {
            alert(data.error || 'Login failed. Please check your credentials.');
        }
    } catch (err) {
        console.error('Login network error:', err);
        alert('An unexpected error occurred. Please try again.');
    }
});
    </script>
</body>
</html>
