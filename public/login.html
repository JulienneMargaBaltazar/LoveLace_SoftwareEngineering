<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - LoveLace</title>
    <!-- External Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional helper for login-specific alignment */
        .forgot-container {
            text-align: right;
            margin-bottom: 1.25rem;
        }
        .forgot-container a {
            font-size: 0.875rem;
            color: #5C5C99;
            text-decoration: none;
            font-weight: 600;
        }
        .forgot-container a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Welcome back</h2>
        <h4>Log in to continue to your workspace.</h4>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@company.com" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <!-- Forgot Password Link -->
            <div class="forgot-container">
                <a href="/forgotpassword.html">Forgot password?</a>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/signup.html">Sign up</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // Accepts the session cookie
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json(); // Fixed stray 'a' here

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed.');
                }

                // Check if first-time login requires a password reset
                if (data.requiresPasswordReset) {
                    window.location.href = `/set-password.html?email=${encodeURIComponent(email)}`;
                    return;
                }

                // SUCCESS: Redirect dynamically based on backend role response (`redirectUrl`)
                if (data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                } else {
                    window.location.href = '/dashboard.html'; // Fallback
                }

            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
