<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LoveLace</title>
    <!-- Shared Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span>LoveLace Inc. ERP</span>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item active"><a href="/dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a href="#">Customers</a></li>
                <li class="nav-item"><a href="#">Products</a></li>
                <li class="nav-item"><a href="#">Orders</a></li>
                <li class="nav-item"><a href="#">Reports</a></li>
                <li class="nav-item"><a href="#">User Management</a></li>
                <li class="nav-item"><a href="#">Settings</a></li>
            </ul>
        </aside>

        <!-- Main Workspace Area -->
        <main class="main-content">
            <!-- Header Bar -->
            <header class="top-header">
                <h1>Dashboard</h1>
                <div>
                    <button id="logoutBtn" class="logout-btn">Admin Log Out</button>
                </div>
            </header>

            <div class="dashboard-container">
                <!-- Welcome Banner -->
                <section class="welcome-banner">
                    <h2>Welcome back, Admin!</h2>
                    <p id="userInfo" style="margin: 0; color: #5C5C99; font-size: 0.875rem;">Loading session details...</p>
                </section>

                <!-- Key Metrics / Stats Row -->
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-header">Revenue</div>
                        <div class="stat-value">
                            $48,290
                            <span class="badge-pill success">+12%</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">Active Users</div>
                        <div class="stat-value">
                            2,352
                            <span class="badge-pill success">+8%</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">Orders</div>
                        <div class="stat-value">
                            1,204
                            <span class="badge-pill success">+4%</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-header">Avg Order Value</div>
                        <div class="stat-value">
                            $1,420
                            <span class="badge-pill success">+2%</span>
                        </div>
                    </div>
                </section>

                <!-- Quick Actions Block -->
                <h3 style="color: #292966; font-size: 1rem; margin-bottom: 1rem;">Quick Actions</h3>
                <section class="actions-grid">
                    <div class="action-card"></div>
                    <div class="action-card"></div>
                    <div class="action-card"></div>
                    <div class="action-card"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Session & Logout Handler -->
    <script>
        // 1. Verify Active Session on Page Load
        async function checkSession() {
            try {
                const response = await fetch('/api/dashboard', { credentials: 'include' });
                
                if (!response.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await response.json();
                document.getElementById('userInfo').innerText = 
                    `Logged in as: ${data.userSessionData?.email || 'Admin'} (ID: ${data.userSessionData?.userId || 'N/A'})`;
            } catch (err) {
                console.error('Session check failed:', err);
                window.location.href = '/login.html';
            }
        }

        checkSession();

        // 2. Attach Logout Handler
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Logout failed.');
                }

                window.location.href = '/login.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
